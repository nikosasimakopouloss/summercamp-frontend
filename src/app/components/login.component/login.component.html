<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Σύνδεση</h2>
      <p>Συνδεθείτε στον λογαριασμό σας</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Όνομα Χρήστη</label>
        <input 
          type="text" 
          id="username"
          formControlName="username" 
          class="form-control"
          [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          placeholder="Εισάγετε το όνομα χρήστη σας"
        >
        <div 
          *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" 
          class="invalid-feedback"
        >
          Απαιτείται όνομα χρήστη
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Κωδικός</label>
        <input 
          type="password" 
          id="password"
          formControlName="password" 
          class="form-control"
          [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          placeholder="Εισάγετε τον κωδικό σας"
        >
        <div 
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" 
          class="invalid-feedback"
        >
          Απαιτείται κωδικός
        </div>
      </div>

      <div class="form-group">
        <button 
          type="submit" 
          [disabled]="loginForm.invalid || userService.loading()" 
          class="btn btn-primary w-100"
        >
          <span *ngIf="userService.loading()" class="spinner-border spinner-border-sm me-2"></span>
          {{ userService.loading() ? 'Σύνδεση...' : 'Σύνδεση' }}
        </button>
      </div>
      
      <div *ngIf="userService.error()" class="alert alert-danger mt-3">
        <i class="bi bi-exclamation-triangle me-2"></i>
        {{ userService.error() }}
      </div>
    </form>
    
    <div class="login-footer">
      <p class="text-center mb-0">
        Δεν έχετε λογαριασμό; 
        <a routerLink="/register" class="register-link">Εγγραφή</a>
      </p>
    </div>
  </div>
</div>
