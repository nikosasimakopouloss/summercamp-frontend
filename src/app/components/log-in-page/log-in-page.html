<h4>User Login:</h4>

<form [formGroup] = "form" class="d-flex flex-column gap-1 w-100">
  <mat-form-field>
    <mat-label>Username:</mat-label>
    <input type="text" matInput formControlName="username" >
    <mat-error>Username is required</mat-error>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Password:</mat-label>
    <input type="text" matInput formControlName="password">
    <mat-error>Password is required</mat-error>
  </mat-form-field>
</form>

<button mat-flat-button="outlined" color="primary" (click)="onSubmit(); goToUserViewMenu()">Submit</button>

<div>
<button mat-flat-button="outlined" color="primary" 
(click)="goToCreateAccount()"


>Don't have an accoount?</button>


</div>
